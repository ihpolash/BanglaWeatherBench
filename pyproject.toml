[project]
name = "banglaweatherbench"
version = "0.1.0"
description = "Monsoon-stratified benchmark of time-series foundation models on Bangladesh station observations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "pdfplumber>=0.11",
    "xlrd>=2.0",
    "requests>=2.31",
    "matplotlib>=3.8",
    "geopandas>=1.1.4",
    "shapely>=2.1.2",
    "pyogrio>=0.13.0",
    "pyyaml>=6.0.3",
    "statsforecast>=2.0.1",
    "lightgbm>=4.7.0",
]

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bwb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
